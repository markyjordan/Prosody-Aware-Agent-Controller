[project]
name = "prosody-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marky Jordan", email = "oss@markyjordan.xyz" }
]
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=2.65.0",
    "fastapi>=0.141.1",
    "openai>=3.5.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[project.scripts]
prosody-api = "prosody_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
