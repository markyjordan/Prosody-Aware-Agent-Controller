name: prosody-controller

channels:
  - conda-forge
  - nodefaults

dependencies:
  # Runtime and portable CPU/MPS PyTorch stack.
  - python=3.12
  - pip
  # TensorBoard 2.20 still imports pkg_resources, removed in setuptools 81.
  - "setuptools<81"
  - "pytorch=2.9.1=*cpu*"
  - "torchaudio=2.9.1=*cpu*"
  - "torchcodec=0.8.1=*cpu*"

  # Audio and tabular data handling.
  - "datasets>=4,<6"
  - huggingface_hub
  - "numpy>=2,<3"
  - scipy
  - pandas
  - pyarrow
  - scikit-learn
  - librosa
  - pysoundfile
  - ffmpeg

  # Interactive research and local experiment inspection.
  - "jupyterlab>=4,<5"
  - ipykernel
  - ipywidgets
  - matplotlib
  - seaborn
  - tensorboard
  - pyyaml
  - rich
  - tqdm

  # Future source-quality tooling. Dependencies remain owned here, not in
  # pyproject.toml.
  - pytest
  - pytest-cov
  - ruff
  - mypy
